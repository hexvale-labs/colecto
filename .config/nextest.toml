# cargo-nextest configuration (https://nexte.st)
# Colecto runs Rust tests in parallel processes; slow-timeout surfaces regressions early.

[profile.default]
test-threads = "num-cpus"
fail-fast = false
slow-timeout = { period = "15s", terminate-after = 4 }

[profile.ci]
test-threads = "num-cpus"
fail-fast = false
retries = 0
slow-timeout = { period = "20s", terminate-after = 3 }
status-level = "fail"
final-status-level = "slow"
