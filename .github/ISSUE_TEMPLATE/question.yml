name: Question
description: Ask how something works or how to set it up.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried or read so far?
      description: For example the docs page you followed, or the settings you changed.
