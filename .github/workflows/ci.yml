name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # CI never attaches a debugger; skipping debug info shrinks the cached target dir and speeds up linking.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Only main and develop write the Rust cache; pull requests restore from their base
      # branch or main instead of each saving a near-identical ~800 MB copy that evicts the
      # useful one. develop saves only when its dependencies differ from main's (an exact
      # hit is not saved again), so a dependency change there is cached before the release.
      # rust-cache keys on dependencies and the lockfile only, but [profile.*] in the root
      # Cargo.toml changes every artifact too, so its hash is part of each shared-key (a
      # plain `key` is ignored once shared-key is set).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: verify-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/package.json

      # Like the Rust cache, only main and develop save Bun and Playwright caches, and only
      # on a miss; a pull request's copy could only be reused by that pull request and
      # would crowd out release caches.
      - name: Restore Bun packages
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: just install ui

      - name: Save Bun packages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      # Browser builds depend only on the installed Playwright version and the browsers
      # installed below, not on the rest of the lockfile.
      - name: Resolve Playwright cache key
        id: playwright
        run: |
          version=$(jq -r .version ui/node_modules/playwright-core/package.json)
          echo "key=playwright-${{ runner.os }}-$version-chromium-webkit" >> "$GITHUB_OUTPUT"

      # One apt transaction for the Rust build and Playwright's browser libraries. This skips
      # `playwright install --with-deps`, which always runs a slow `apt-get update` first.
      - name: List Playwright system libraries
        id: playwright-deps
        working-directory: ui
        run: |
          packages=$(bunx playwright install-deps --dry-run chromium webkit | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p' | xargs)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Install Linux build and browser dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: libssl-dev libdbus-1-dev pkg-config ${{ steps.playwright-deps.outputs.packages }}

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}

      - name: Install Playwright browsers
        working-directory: ui
        run: bunx playwright install chromium webkit

      - name: Save Playwright browsers
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      - run: just verify
      - run: just test browser

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Sends, receives, searches and downloads attachments through a real JMAP server (Cyrus in Docker).
  jmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: libssl-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Reuse verify's cache (it compiles a superset of these crates) instead of storing another.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: verify-${{ hashFiles('Cargo.toml') }}
          save-if: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - run: just test jmap

  prune-caches:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: verify
    permissions:
      actions: write
    uses: ./.github/workflows/prune-caches.yml
