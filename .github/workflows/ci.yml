name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # CI never attaches a debugger; skipping debug info shrinks the cached target dir and speeds up linking.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Only main writes the Rust cache; pull requests restore from it instead of
      # each saving a near-identical ~800 MB copy that evicts the useful one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ui/package.json

      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: just install ui

      # Browser builds depend only on the installed Playwright version and the browsers
      # installed below, not on the rest of the lockfile.
      - name: Resolve Playwright cache key
        id: playwright
        run: |
          version=$(jq -r .version ui/node_modules/playwright-core/package.json)
          echo "key=playwright-${{ runner.os }}-$version-chromium-webkit" >> "$GITHUB_OUTPUT"

      # One apt transaction for the Rust build and Playwright's browser libraries. This skips
      # `playwright install --with-deps`, which always runs a slow `apt-get update` first.
      - name: List Playwright system libraries
        id: playwright-deps
        working-directory: ui
        run: |
          packages=$(bunx playwright install-deps --dry-run chromium webkit | sed -n 's/^  \([a-z0-9][a-z0-9.+-]*\)$/\1/p' | xargs)
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

      - name: Install Linux build and browser dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: libssl-dev libdbus-1-dev pkg-config ${{ steps.playwright-deps.outputs.packages }}

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}

      - name: Install Playwright browsers
        working-directory: ui
        run: bunx playwright install chromium webkit
      - run: just verify
      - run: just test browser

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Sends, receives, searches and downloads attachments through a real JMAP server (Cyrus in Docker).
  jmap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: libssl-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Reuse verify's cache (it compiles a superset of these crates) instead of storing another.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: verify
          save-if: false

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - run: just test jmap

  # Each Cargo.lock or toolchain change saves a new Rust cache (700 MB for verify, more per
  # release target) while the superseded one lingers for a week. Keep only the newest of
  # each so the 10 GB repository budget holds CI and release caches together.
  prune-caches:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete superseded Rust caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          seen=" "
          gh cache list --key v0-rust- --limit 200 --sort created_at --order desc --json id,key \
            --jq '.[] | "\(.id) \(.key)"' |
          while read -r id key; do
            family=${key%-*-*} # without the toolchain and lockfile hashes
            if [[ "$seen" == *" $family "* ]]; then
              echo "Deleting $key"; gh cache delete "$id"
            else
              seen+="$family "
            fi
          done
