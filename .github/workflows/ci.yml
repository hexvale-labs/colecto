name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # CI never attaches a debugger; skipping debug info shrinks the cached target dir and speeds up linking.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      flutter: ${{ steps.filter.outputs.flutter }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'just/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            flutter:
              - 'app/**'
              - 'just/**'
              - 'justfile'
              - '.github/workflows/ci.yml'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - 'packaging/docker/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**'
              - 'app/**'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Fail fast on formatting before installing system packages or restoring caches.
      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Install Linux build dependencies
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: libssl-dev libdbus-1-dev pkg-config mold

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: verify-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just, cargo-nextest

      # Clippy checks all targets (bins, libs, tests) so a separate `cargo check` pass is redundant.
      - name: Clippy
        run: just check lint

      - name: Run unit & integration tests
        run: cargo nextest run --workspace --locked

      - name: Run doctests
        run: cargo test --workspace --doc --locked

  flutter:
    name: Flutter
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Fail fast on Dart formatting before restoring pub cache or running builds.
      - name: Check Dart formatting
        run: cd app && dart format --output=none --set-exit-if-changed .

      - name: Restore Pub packages
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just

      - name: Fetch Flutter dependencies
        run: just install app

      - name: Save Pub packages
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Analyze Flutter app
        run: just check app

      - name: Test Flutter app
        run: just test app

      - name: Restore cached Flutter Web bundle
        id: web-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/colecto-web.tar.zst
          key: web-bundle-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml', 'app/pubspec.lock', 'app/lib/**', 'app/web/**', 'app/assets/**') }}

      - name: Build and compress Flutter Web bundle
        if: steps.web-cache.outputs.cache-hit != 'true'
        run: |
          just build web
          mkdir -p dist
          tar -I 'zstd -T0 -12' -cf dist/colecto-web.tar.zst -C app/build web
          ls -lh dist/colecto-web.tar.zst

      - name: Save Flutter Web bundle cache
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && steps.web-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/colecto-web.tar.zst
          key: ${{ steps.web-cache.outputs.cache-primary-key }}

      - name: Upload compressed Flutter Web artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: colecto-web
          path: dist/colecto-web.tar.zst
          compression-level: 0
          retention-days: 14

  docker:
    name: Daemon Docker image
    needs: [changes, rust, flutter]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      (needs.rust.result == 'success' || needs.rust.result == 'skipped') &&
      (needs.flutter.result == 'success' || needs.flutter.result == 'skipped') &&
      (github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Flutter Web bundle from this run
        if: needs.flutter.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: colecto-web
          path: dist

      - name: Restore cached Flutter Web bundle (when Flutter job was skipped)
        if: needs.flutter.result == 'skipped'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dist/colecto-web.tar.zst
          key: web-bundle-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml', 'app/pubspec.lock', 'app/lib/**', 'app/web/**', 'app/assets/**') }}

      - name: Unpack Flutter Web bundle
        id: web
        run: |
          mkdir -p dist/web
          if [ -f dist/colecto-web.tar.zst ]; then
            tar -I zstd -xf dist/colecto-web.tar.zst -C dist
            echo "web_bundled=true" >> "$GITHUB_OUTPUT"
          else
            echo "No cached Flutter Web bundle available; building daemon image without bundled web UI."
            echo "web_bundled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build daemon image (local for smoke test)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: COLECTO_COMMIT=${{ github.sha }}
          build-contexts: web-assets=dist/web
          load: true
          tags: colecto-daemon:ci
          cache-from: type=gha,scope=daemon-docker
          cache-to: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && 'type=gha,mode=max,scope=daemon-docker' || '' }}

      - name: Smoke-test daemon container
        run: |
          # 1. Default non-loopback bind must fail closed without COLECTO_PUBLIC_ORIGIN + COLECTO_TOKEN_FILE.
          if docker run --rm colecto-daemon:ci >/tmp/fail-closed.log 2>&1; then
            echo "Expected daemon to fail closed without COLECTO_PUBLIC_ORIGIN"
            cat /tmp/fail-closed.log
            exit 1
          fi
          grep -q "COLECTO_PUBLIC_ORIGIN" /tmp/fail-closed.log

          # 2. Loopback mode must boot and answer /api/v1/version (use --network host so 127.0.0.1 is reachable).
          cid=$(docker run -d --rm --network host -e COLECTO_BIND=127.0.0.1 colecto-daemon:ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/api/v1/version >/tmp/version.json 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          cat /tmp/version.json
          grep -q '"version"' /tmp/version.json

          # 3. Verify bundled Flutter Web index.html when present.
          if [ "${{ steps.web.outputs.web_bundled }}" = "true" ]; then
            curl -fsS http://127.0.0.1:4173/ | grep -qi '<!DOCTYPE html>'
          fi

  verify:
    name: verify
    needs: [changes, rust, flutter]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs succeeded
        run: |
          for result in "${{ needs.changes.result }}" "${{ needs.rust.result }}" "${{ needs.flutter.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::One or more required CI jobs failed"
              exit 1
            fi
          done

  prune-caches:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    needs: [rust, flutter]
    permissions:
      actions: write
    uses: ./.github/workflows/prune-caches.yml
