name: Release

# A semver tag such as `v0.10.0` builds Linux, Windows, macOS, Android and Web, publishes
# a GitHub release, pushes the multi-arch daemon image to GHCR, and updates AUR packages.
# Every other run builds everything without publishing (to warm caches or test packaging).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - app/pubspec.lock
      - app/pubspec.yaml
      - .github/workflows/release.yml
      - .github/actions/**
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:
    inputs:
      artifacts:
        description: Upload the release bundles as workflow artifacts
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UPLOAD: ${{ startsWith(github.ref, 'refs/tags/') || inputs.artifacts }}
  CARGO_INCREMENTAL: 0
  # Compiled into colecto-daemon and reported by `GET /api/v1/version`.
  COLECTO_COMMIT: ${{ github.sha }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then tag="$REF_NAME"; else tag="v0.0.1"; fi
          number="${tag#v}"
          if ! [[ "$number" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3"; exit 1
          fi
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          pubspec=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml | head -n1)
          if [[ "$REF" == refs/tags/v* && "$number" != "$crate" ]]; then
            echo "::error::Tag $tag does not match version $crate in Cargo.toml; run 'just bump-version $number' first"; exit 1
          fi
          if [[ "$REF" == refs/tags/v* && "$number" != "$pubspec" ]]; then
            echo "::error::Tag $tag does not match version $pubspec in app/pubspec.yaml; run 'just bump-version $number' first"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

  web:
    needs: version
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Pub packages
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Build Flutter Web
        working-directory: app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --build-name=${{ needs.version.outputs.number }}

      - name: Save Pub packages
        if: github.ref == 'refs/heads/main' && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Package Web bundle
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          tar -czf "dist/colecto-$TAG-web.tar.gz" -C app/build web
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        name: Upload Web bundle for daemon image
        with:
          name: web-assets
          path: app/build/web
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.UPLOAD == 'true'
        with:
          name: web
          path: dist/*
          if-no-files-found: error

  desktop:
    needs: version
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, arch: x64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { platform: linux, arch: arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: windows, arch: x64, runner: windows-2025, target: x86_64-pc-windows-msvc }
          - { platform: macos, arch: arm64, runner: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        uses: ./.github/actions/apt-install
        timeout-minutes: 10
        with:
          packages: >-
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
            libssl-dev libdbus-1-dev mold

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: subosito/flutter-action@v2
        if: matrix.runner != 'ubuntu-24.04-arm'
        with:
          channel: stable
          cache: true

      # Flutter publishes no Linux arm64 SDK archive, so check out the stable branch instead.
      - name: Install Flutter (Linux arm64)
        if: matrix.runner == 'ubuntu-24.04-arm'
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Build Rust FFI, daemon and MCP binaries
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p colecto-ffi -p colecto-daemon

      - name: Build Flutter desktop app
        working-directory: app
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          flutter pub get
          case "${{ matrix.platform }}" in
            linux)
              COLECTO_FFI_LIB="$(pwd)/../target/${{ matrix.target }}/release/libcolecto_ffi.so" \
                flutter build linux --release --dart-define=COLECTO_BACKEND=ffi --build-name="$VERSION"
              ;;
            windows)
              COLECTO_FFI_LIB="$(pwd)/../target/${{ matrix.target }}/release/colecto_ffi.dll" \
                flutter build windows --release --dart-define=COLECTO_BACKEND=ffi --build-name="$VERSION"
              ;;
            macos)
              COLECTO_FFI_LIB="$(pwd)/../target/${{ matrix.target }}/release/libcolecto_ffi.dylib" \
                flutter build macos --release --dart-define=COLECTO_BACKEND=ffi --build-name="$VERSION"
              ;;
          esac

      - name: Package desktop bundle
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          TARGET_DIR: target/${{ matrix.target }}/release
        run: |
          set -euo pipefail
          name="colecto-$TAG-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p dist "stage/$name"
          case "${{ matrix.platform }}" in
            linux)
              bundle_dir=$(find app/build/linux -type d -name bundle | head -n1)
              cp -a "$bundle_dir"/. "stage/$name/"
              cp "$TARGET_DIR/colecto-daemon" "$TARGET_DIR/colecto-mcp" "stage/$name/"
              cp packaging/linux/Colecto.desktop "stage/$name/"
              tar -czf "dist/$name.tar.gz" -C stage "$name"
              ;;
            windows)
              bundle_dir=$(find app/build/windows -type d -path '*/runner/Release' | head -n1)
              cp -a "$bundle_dir"/. "stage/$name/"
              cp "$TARGET_DIR/colecto-daemon.exe" "$TARGET_DIR/colecto-mcp.exe" "stage/$name/"
              7z a -tzip "dist/$name.zip" "./stage/$name"
              ;;
            macos)
              cp -a app/build/macos/Build/Products/Release/colecto.app "stage/$name/Colecto.app"
              cp "$TARGET_DIR/colecto-daemon" "$TARGET_DIR/colecto-mcp" "stage/$name/"
              tar -czf "dist/$name.tar.gz" -C stage "$name"
              ;;
          esac
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.UPLOAD == 'true'
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  android:
    needs: version
    name: android-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, abi: arm64-v8a, triple: aarch64-linux-android, flutter_platform: android-arm64 }
          - { arch: x64, abi: x86_64, triple: x86_64-linux-android, flutter_platform: android-x64 }
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.triple }}-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-ndk

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Gradle downloads
        id: gradle
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/gradle/wrapper/gradle-wrapper.properties', 'app/android/settings.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build libcolecto_ffi.so for Android
        # The runner's own variables are not in the `env` expression context, so read them here.
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cargo ndk -t ${{ matrix.abi }} -o app/android/app/src/main/jniLibs build --release --locked -p colecto-ffi

      - name: Build Android APK
        working-directory: app
        env:
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          flutter pub get
          flutter build apk --release --dart-define=COLECTO_BACKEND=ffi --target-platform ${{ matrix.flutter_platform }} --build-name="$VERSION"

      - name: Save Gradle downloads
        if: github.ref == 'refs/heads/main' && matrix.arch == 'arm64' && steps.gradle.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
            !~/.gradle/caches/modules-2/*.lock
          key: ${{ steps.gradle.outputs.cache-primary-key }}

      - name: Sign and name the APK
        env:
          TAG: ${{ needs.version.outputs.tag }}
          ARCH: ${{ matrix.arch }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          keystore="$RUNNER_TEMP/release.p12"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            export KS_PASS="$KEYSTORE_PASSWORD"
          elif [ "$UPLOAD" = "true" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are needed to publish APKs"
            exit 1
          else
            echo "::warning::No release key; signing with a throwaway key"
            export KS_PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass:env KS_PASS -keypass:env KS_PASS \
              -alias colecto -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Colecto" -noprompt
          fi
          mkdir -p dist
          "$apksigner" sign --v4-signing-enabled false --ks "$keystore" --ks-type PKCS12 --ks-key-alias colecto --ks-pass env:KS_PASS \
            --out "dist/colecto-$TAG-android-$ARCH.apk" \
            "app/build/app/outputs/flutter-apk/app-release.apk"
          ls -lh dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.UPLOAD == 'true'
        with:
          name: android-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  prune-caches:
    if: always() && github.ref == 'refs/heads/main'
    needs: [web, desktop, android]
    permissions:
      actions: write
    uses: ./.github/workflows/prune-caches.yml

  daemon-image:
    if: github.event_name != 'schedule'
    needs: [version, web]
    name: daemon image (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-assets
          path: dist/web

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: COLECTO_COMMIT=${{ github.sha }}
          build-contexts: web-assets=dist/web
          outputs: ${{ startsWith(github.ref, 'refs/tags/') && format('type=image,name=ghcr.io/{0}/colectod,push-by-digest=true,name-canonical=true,push=true', github.repository_owner) || 'type=cacheonly' }}

      - name: Record the digest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p digests && touch "digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, web, desktop, android, daemon-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/release-notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
          pattern: '!(web-assets)'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the daemon image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/colectod
          VERSION: ${{ needs.version.outputs.number }}
        run: |
          set -euo pipefail
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          IFS=. read -r major minor _ <<< "$VERSION"
          digests=$(find dist -maxdepth 1 -type f -size 0 -printf "$image@sha256:%f ")
          docker buildx imagetools create -t "$image:v$VERSION" -t "$image:v$major.$minor" -t "$image:v$major" \
            -t "$image:latest" $digests
          find dist -maxdepth 1 -type f -size 0 -delete

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NOTES: .github/release-notes/${{ needs.version.outputs.tag }}.md
        run: |
          (cd dist && sha256sum colecto-* > SHA256SUMS.txt)
          footer="Installers are not signed. See https://github.com/$GITHUB_REPOSITORY/blob/main/docs/install.md before installing."
          if [[ -f "$NOTES" ]]; then
            notes=$(cat "$NOTES"; printf '\n\n%s\n' "$footer")
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Colecto $TAG" --notes "$notes"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Colecto $TAG" --generate-notes --notes "$footer"
          fi

  aur:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, publish]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update the AUR packages
        if: env.AUR_KEY != ''
        run: |
          pacman -Syu --noconfirm --needed python
          python3 scripts/python/aur_publish.py --version "$VERSION" --push
