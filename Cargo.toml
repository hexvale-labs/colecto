[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
colecto-core = { path = "crates/colecto-core" }
colecto-extension-api = { path = "crates/colecto-extension-api" }

[workspace.lints.rust]
unsafe_code = "forbid"
