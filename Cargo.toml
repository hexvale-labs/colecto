[workspace]
members = ["crates/colecto-core", "crates/colecto-service", "crates/colecto-daemon", "crates/colecto-ffi"]
resolver = "3"

[workspace.package]
version = "0.10.1"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/kogical/colecto"

[workspace.dependencies]
turso = { version = "=0.7.2", default-features = false }
futures-executor = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = "2.4.1"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mailparse = "0.16"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
ammonia = "4"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "registry"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-std", "io-util", "process"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
roxmltree = "0.21"
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf"] }
subtle = "2"
sha2 = "0.10"
getrandom = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
dbus = "0.9"
rustix = { version = "1", features = ["process"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
futures-util = "0.3"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
tempfile = "3"
colecto-core = { path = "crates/colecto-core" }
colecto-service = { path = "crates/colecto-service" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = "symbols"
