[workspace]
exclude = ["docs/extensions/examples/oneko"]
members = ["crates/*"]
# The Tauri app needs WebView system libraries; build it with `just build native`.
default-members = ["crates/cargo-colecto", "crates/colecto-core", "crates/colecto-extension", "crates/colecto-extension-api", "crates/colecto-extension-sys", "crates/colecto-host", "crates/colecto-package"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/hexvale-labs/colecto"

[workspace.dependencies]
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
turso = { version = "=0.7.2", default-features = false }
futures-executor = "0.3"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }
toml = "0.9"
wasmi = "2"
wat = "1"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-build = "2"
glib = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
axum = "0.8"
futures-util = "0.3"
subtle = "2"
sha2 = "0.10"
getrandom = "0.3"
rustix = { version = "1", features = ["process"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-std", "io-util", "process"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "registry"] }
tracing-appender = "0.2"
tower = { version = "0.5", features = ["util"] }
colecto-core = { path = "crates/colecto-core" }
colecto-extension-api = { path = "crates/colecto-extension-api" }
colecto-extension-sys = { path = "crates/colecto-extension-sys" }
colecto-package = { path = "crates/colecto-package" }
colecto-host = { path = "crates/colecto-host" }
tauri-plugin-colecto-native = { path = "crates/colecto-native" }

imap = "2.4.1"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mailparse = "0.16"
base64 = "0.22"
# Extension packages (.colectoext) are zip files; only Deflate and Stored entries are read.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip leaves the Deflate backend to us; this is the pure-Rust miniz_oxide one already in the tree.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Auto-label rules; linear-time matching with size limits, already in the tree.
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Line tables keep backtrace line numbers while making debug test binaries much
# smaller and faster to link than full debug info.
[profile.dev]
debug = "line-tables-only"

# `just build release`. No cross-crate LTO: thin LTO re-optimized every dependency at each
# link (446 s of a 700 s rebuild of the app) and gave a larger binary (34.3 MB vs 33.2 MB).
[profile.release]
strip = "symbols"
