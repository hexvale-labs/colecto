[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
toml = "0.9"
wasmi = "2"
wat = "1"
tauri = "2"
tauri-build = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
axum = "0.8"
futures-util = "0.3"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
colecto-core = { path = "crates/colecto-core" }
colecto-extension-api = { path = "crates/colecto-extension-api" }

imap = "2.4.1"
native-tls = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mailparse = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }

argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[workspace.lints.rust]
unsafe_code = "forbid"
