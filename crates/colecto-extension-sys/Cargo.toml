[package]
name = "colecto-extension-sys"
description = "Raw bridge to the Colecto guest ABI; the only SDK crate that contains unsafe code."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# No `lints.workspace`: the workspace forbids unsafe code, and this crate exists to hold
# the few unsafe lines the ABI needs, so every other crate can keep forbidding it.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
