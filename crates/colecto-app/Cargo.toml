[package]
name = "colecto-app"
description = "Colecto desktop and mobile app (Tauri)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Android and iOS load the app as a library; desktop runs the `colecto` binary.
[lib]
name = "colecto_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "colecto"
path = "src/main.rs"

[dependencies]
axum.workspace = true
colecto-host.workspace = true
tauri.workspace = true
tauri-plugin-colecto-native.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[build-dependencies]
tauri-build.workspace = true

# Already in the tree through Tauri's GTK stack; used to set the Wayland app_id.
[target.'cfg(target_os = "linux")'.dependencies]
glib.workspace = true

# Desktop-only dependencies: custom protocol bridge and opening mail links in the system browser.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
futures-util.workspace = true
open = "5"
serde.workspace = true
serde_json.workspace = true
tower.workspace = true

# Android has no system OpenSSL for native-tls to link; build it from source there.
# colecto-core provides the SecretStore trait bridged to Android Keystore.
[target.'cfg(target_os = "android")'.dependencies]
colecto-core.workspace = true
openssl = { version = "0.10", features = ["vendored"] }
