name: colecto
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
section: mail
priority: optional
maintainer: Kogical <https://github.com/kogical>
description: Fast, native email client (Flutter desktop app and Rust daemon)
homepage: https://github.com/kogical/colecto
license: MIT OR Apache-2.0

overrides:
  deb:
    depends:
      - libgtk-3-0
      - libglib2.0-0
      - libepoxy0
      - libssl3
      - libdbus-1-3
      - ca-certificates
    recommends:
      - gnome-keyring | org.freedesktop.secrets
  rpm:
    depends:
      - gtk3
      - libepoxy
      - openssl-libs
      - dbus-libs
      - ca-certificates

contents:
  - src: stage/linux/colecto
    dst: /usr/lib/colecto/colecto
    file_info:
      mode: 0755
  - src: stage/linux/data
    dst: /usr/lib/colecto/data
  - src: stage/linux/lib
    dst: /usr/lib/colecto/lib
  - src: /usr/lib/colecto/colecto
    dst: /usr/bin/colecto
    type: symlink
  - src: stage/linux/colecto-daemon
    dst: /usr/bin/colecto-daemon
    file_info:
      mode: 0755
  - src: stage/linux/colecto-mcp
    dst: /usr/bin/colecto-mcp
    file_info:
      mode: 0755
  - src: packaging/linux/Colecto.desktop
    dst: /usr/share/applications/Colecto.desktop
    file_info:
      mode: 0644
  - src: app/assets/branding/logo-square.svg
    dst: /usr/share/icons/hicolor/scalable/apps/colecto.svg
    file_info:
      mode: 0644
  - src: app/macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_256.png
    dst: /usr/share/icons/hicolor/256x256/apps/colecto.png
    file_info:
      mode: 0644
  - src: LICENSE-MIT
    dst: /usr/share/licenses/colecto/LICENSE-MIT
    file_info:
      mode: 0644
  - src: LICENSE-APACHE
    dst: /usr/share/licenses/colecto/LICENSE-APACHE
    file_info:
      mode: 0644
