[package]
name = "oneko"
version = "0.1.0"
edition = "2024"
[lib]
crate-type = ["cdylib"]
[dependencies]
colecto-extension = { path = "../../../../crates/colecto-extension" }
serde = { version = "1", features = ["derive"] }
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
