id = "oneko"
name = "Oneko"
author = "Colecto Extras"
description = "A tiny pixel cat who lives on your screen, naps while you read and scampers after your cursor."
api_version = 1
slot = "overlay"
capabilities = ["window.overlay"]
z_index = 10000

[[settings]]
key = "speed"
label = "Running speed"
description = "How far the cat moves with each step."
type = "range"
default = 10
min = 2
max = 30
step = 1
unit = "px"

[[settings]]
key = "opacity"
label = "Opacity"
type = "range"
default = 100
min = 20
max = 100
step = 1
unit = "%"

[[settings]]
key = "stop_distance"
label = "Stop distance"
description = "How close the cat gets to your pointer before it sits down."
type = "range"
default = 44
min = 24
max = 160
step = 1
unit = "px"
