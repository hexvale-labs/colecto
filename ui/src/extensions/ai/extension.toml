id = "ai"
name = "AI"
api_version = 1
client = "client/main.js"
service = "service.wasm"
capabilities = ["messages.read", "messages.list", "messages.label", "ai.text", "ai.decide", "ai.configure", "ui.contribute", "extensions.bus"]
description = "Optional summaries, drafted replies and automatic labels using AI services you configure. Off until you turn it on in Settings → AI."
author = "Colecto"

# Settings → AI lists the account's labels, so the client part reloads them when Mail or the
# reader changes them, and it offers entries in Mail's message menu (`row_action`, `ready`).
# The service part has no handler for these events and ignores them.
[bus]
subscribe = ["inbox/v1/labels", "reader/v1/labels", "inbox/v1/ready", "inbox/v1/row_action"]

[settings_page]
title = "AI"
icon = "cpu"
