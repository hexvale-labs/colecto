- /children: deep-equal
- dialog "Settings":
  - banner:
    - button "Back to Settings"
  - region "Settings":
    - heading "Accounts & security" [level=2]
    - paragraph: Each account keeps its own mail and drafts. Credentials stay in your system’s credential store unless you protect them with a master password.
    - region "Mail accounts":
      - heading "Mail accounts" [level=2]
      - list:
        - listitem:
          - strong: Demo account
          - text: Sample
          - switch "Use Demo account" [checked]
      - button "Add account"
      - heading "Accounts pane" [level=3]
      - paragraph: Show the account switcher as a pane in the workspace.
      - checkbox "Accounts pane" [checked]
    - region "Credential protection":
      - heading "Credential protection" [level=2]
      - paragraph: System credential store
      - paragraph: By default, passwords and tokens stay in your system credential store. Optionally protect them with a master password.
      - paragraph: Protects credentials only. Local emails and drafts remain unencrypted. A forgotten master password cannot be recovered.
      - group:
        - text: Master password
        - textbox "Master password"
        - text: Confirm master password
        - textbox "Confirm master password"
        - button "Enable password protection" [disabled]