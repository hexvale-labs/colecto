- /children: deep-equal
- dialog "Settings":
  - navigation "Settings sections":
    - heading "Settings" [level=1]
    - button "Collapse the section list" [expanded]
    - group "Built-in":
      - text: ""
      - button "Accounts"
      - button "Mail"
      - button "Appearance"
      - button "Notifications"
      - button "Privacy"
      - button "Connection"
      - button "Extensions"
      - button "AI"
      - button "API keys"
      - button "Send approvals"
  - banner:
    - paragraph:
      - text: Settings
      - strong: Appearance
    - button "Close settings"
  - region "Appearance":
    - heading "Appearance" [level=2]
    - paragraph: Colecto stays dark. Choose how text looks, the accent used for selection, focus and primary buttons, and how the message list is laid out.
    - heading "Text" [level=3]
    - heading "Font" [level=4]
    - paragraph: Bundled fonts work offline on every device. System fonts must be installed where you use Colecto.
    - button "Interface font": Mona Sans
    - button "List all installed fonts"
    - group "Text size":
      - text: ""
      - heading "Text size" [level=4]
      - paragraph: Scales text across the app.
      - radio "Small"
      - text: Small
      - radio "Default" [checked]
      - text: Default
      - radio "Large"
      - text: Large
      - radio "Larger"
      - text: Larger
    - group "Letter spacing":
      - text: ""
      - heading "Letter spacing" [level=4]
      - paragraph: Space between characters.
      - radio "Normal" [checked]
      - text: Normal
      - radio "More"
      - text: More
      - radio "Most"
      - text: Most
    - group "Word spacing":
      - text: ""
      - heading "Word spacing" [level=4]
      - paragraph: Space between words.
      - radio "Normal" [checked]
      - text: Normal
      - radio "More"
      - text: More
      - radio "Most"
      - text: Most
    - group "Line height":
      - text: ""
      - heading "Line height" [level=4]
      - paragraph: Space between lines.
      - radio "Normal" [checked]
      - text: Normal
      - radio "More"
      - text: More
      - radio "Most"
      - text: Most
    - group "Paragraph spacing":
      - text: ""
      - heading "Paragraph spacing" [level=4]
      - paragraph: Space between paragraphs, in mail and descriptions.
      - radio "Normal" [checked]
      - text: Normal
      - radio "More"
      - text: More
      - radio "Most"
      - text: Most
    - heading "Colour" [level=3]
    - heading "Accent" [level=4]
    - paragraph: Used for selection, focus and primary buttons. Pick a preset or any colour.
    - radiogroup "Accent":
      - radio "Mint" [checked]
      - text: Mint
      - radio "Sky"
      - text: Sky
      - radio "Periwinkle"
      - text: Periwinkle
      - radio "Lilac"
      - text: Lilac
      - radio "Rose"
      - text: Rose
      - radio "Coral"
      - text: Coral
      - radio "Amber"
      - text: Amber
      - radio "Lime"
      - text: Lime
      - textbox "Custom colour": "#a2d6b1"
      - text: Custom colour
    - region "Mail":
      - heading "Mail" [level=3]
      - group "List density":
        - text: ""
        - heading "List density" [level=4]
        - paragraph: Full rows show a preview line, medium rows drop it, compact rows take one line.
        - radio "Full" [checked]
        - text: Full
        - radio "Medium"
        - text: Medium
        - radio "Compact"
        - text: Compact
      - heading "Date headings" [level=4]
      - paragraph: Group messages under headings such as Today and November.
      - checkbox "Date headings" [checked]
      - status