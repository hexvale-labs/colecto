- /children: deep-equal
- dialog "Settings":
  - banner:
    - button "Back to Settings"
  - region "Appearance":
    - heading "Appearance" [level=2]
    - paragraph: Colecto stays dark. Choose how text looks, the accent used for selection, focus and primary buttons, and where notifications appear.
    - heading "Text" [level=3]
    - heading "Font" [level=3]
    - paragraph: Bundled fonts work offline on every device. System fonts must be installed where you use Colecto.
    - button "Interface font": Mona Sans
    - button "List all installed fonts"
    - group "Text size":
      - text: ""
      - heading "Text size" [level=3]
      - paragraph: Scales text across the app. Spacing stays compact.
      - radio "Small"
      - text: Small
      - radio "Default" [checked]
      - text: Default
      - radio "Large"
      - text: Large
      - radio "Larger"
      - text: Larger
    - heading "Colour" [level=3]
    - heading "Accent" [level=3]
    - paragraph: Used for selection, focus and primary buttons. Pick a preset or any colour.
    - radiogroup "Accent":
      - radio "Mint" [checked]
      - text: Mint
      - radio "Sky"
      - text: Sky
      - radio "Periwinkle"
      - text: Periwinkle
      - radio "Lilac"
      - text: Lilac
      - radio "Rose"
      - text: Rose
      - radio "Coral"
      - text: Coral
      - radio "Amber"
      - text: Amber
      - radio "Lime"
      - text: Lime
      - textbox "Custom colour": "#a2d6b1"
      - text: Custom colour
    - heading "Notifications" [level=3]
    - heading "Desktop notifications" [level=3]
    - paragraph: Also alert your desktop, but only while Colecto is in the background.
    - checkbox "Desktop notifications"
    - text: Desktop notifications
    - heading "Position" [level=3]
    - paragraph: Where notifications appear in the window. What you are notified about is set in Settings → Notifications.
    - group "Notification position":
      - text: ""
      - radio "Top left"
      - text: Top left
      - radio "Top center" [checked]
      - text: Top center
      - radio "Top right"
      - text: Top right
      - radio "Right"
      - text: Right
      - radio "Bottom right"
      - text: Bottom right
      - radio "Bottom center"
      - text: Bottom center
      - radio "Bottom left"
      - text: Bottom left
      - radio "Left"
      - text: Left
    - button "Show a test notification"