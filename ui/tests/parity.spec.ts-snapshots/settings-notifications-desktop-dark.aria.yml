- /children: deep-equal
- dialog "Settings":
  - navigation "Settings sections":
    - heading "Settings" [level=1]
    - button "Collapse the section list" [expanded]
    - group "Built-in":
      - text: ""
      - button "Accounts"
      - button "Mail"
      - button "Appearance"
      - button "Notifications"
      - button "Privacy"
      - button "Connection"
      - button "Extensions"
      - button "AI"
      - button "API keys"
      - button "Send approvals"
  - banner:
    - paragraph:
      - text: Settings
      - strong: Notifications
    - button "Close settings"
  - region "Notifications":
    - heading "Notifications" [level=2]
    - paragraph: Choose what Colecto tells you about, where it shows notifications and whether they reach your desktop.
    - region "Notify me about":
      - heading "Notify me about" [level=3]
      - heading "New mail" [level=4]
      - paragraph: When a message arrives in any connected account.
      - checkbox "New mail" [checked]
      - heading "Send approvals" [level=4]
      - paragraph: When automation asks to send a message. Reject it from the notification, or open it to review.
      - checkbox "Send approvals" [checked]
      - heading "New updates" [level=4]
      - paragraph: When a newer Colecto release is published. Off means Colecto never checks.
      - checkbox "New updates" [checked]
      - status
    - heading "How they appear" [level=3]
    - heading "Desktop notifications" [level=4]
    - paragraph: Also alert your desktop, but only while Colecto is in the background.
    - checkbox "Desktop notifications"
    - text: Desktop notifications
    - heading "Position" [level=4]
    - paragraph: Where notifications appear in the window.
    - group "Notification position":
      - text: ""
      - radio "Top left"
      - text: Top left
      - radio "Top center" [checked]
      - text: Top center
      - radio "Top right"
      - text: Top right
      - radio "Right"
      - text: Right
      - radio "Bottom right"
      - text: Bottom right
      - radio "Bottom center"
      - text: Bottom center
      - radio "Bottom left"
      - text: Bottom left
      - radio "Left"
      - text: Left
    - button "Show a test notification"