- /children: deep-equal
- dialog "Settings":
  - navigation "Settings sections":
    - heading "Settings" [level=1]
    - button "Collapse the section list" [expanded]
    - group "Built-in":
      - text: ""
      - button "Accounts"
      - button "Mail"
      - button "Appearance"
      - button "Notifications"
      - button "Privacy"
      - button "Connection"
      - button "Extensions"
      - button "AI"
      - button "API keys"
      - button "Send approvals"
  - banner:
    - paragraph:
      - text: Settings
      - strong: API keys
    - button "Close settings"
  - region "API keys":
    - heading "API keys" [level=2]
    - paragraph:
      - text: Give automation access to selected accounts and operations. Keys cannot manage settings, and
      - code: messages.send
      - text: only asks you for approval; it never sends directly.
    - heading "MCP server" [level=3]
    - paragraph:
      - text: Lets MCP clients use a key below at
      - code: /http:\/\/\d+\.\d+\.0\.1:\d+\/api\/v1\/mcp/
      - text: . Off until you turn it on; keys keep working over HTTP either way.
    - checkbox "MCP server"
    - text: MCP server
    - heading "New key" [level=3]
    - paragraph: Choose what the key may reach. You see its secret once, right after it is made.
    - text: Key name
    - textbox "Key name":
      - /placeholder: Desktop assistant
    - group "Accounts":
      - text: ""
      - checkbox "Demo account"
      - text: Demo account
    - group "Operations":
      - text: ""
      - button "Read only"
      - button "Everything"
      - checkbox "Read account connection status"
      - text: Read account connection status
      - checkbox "List messages"
      - text: List messages
      - checkbox "Read messages and attachments"
      - text: Read messages and attachments
      - checkbox "Manage message labels"
      - text: Manage message labels
      - checkbox "List drafts"
      - text: List drafts
      - checkbox "Read drafts"
      - text: Read drafts
      - checkbox "Create and edit drafts"
      - text: Create and edit drafts
      - checkbox "Send mail"
      - text: Send mail
      - checkbox "Navigate the app"
      - text: Navigate the app
    - group "Expires":
      - text: ""
      - radio "Never" [checked]
      - text: Never
      - radio "1 day"
      - text: 1 day
      - radio "1 week"
      - text: 1 week
      - radio /\d+ days/
      - text: /\d+ days/
      - radio /\d+ days/
      - text: /\d+ days/
    - button "Generate API key" [disabled]
    - heading "Issued keys" [level=3]
    - paragraph: No API keys yet. Your mail is keeping to itself.