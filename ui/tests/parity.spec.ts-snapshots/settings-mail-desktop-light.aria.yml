- /children: deep-equal
- dialog "Settings":
  - navigation "Settings sections":
    - heading "Settings" [level=1]
    - button "Collapse the section list" [expanded]
    - group "Built-in":
      - text: ""
      - button "Accounts"
      - button "Mail"
      - button "Appearance"
      - button "Notifications"
      - button "Privacy"
      - button "Connection"
      - button "Extensions"
      - button "AI"
      - button "API keys"
      - button "Send approvals"
  - banner:
    - paragraph:
      - text: Settings
      - strong: Mail
    - button "Close settings"
  - region "Mail":
    - heading "Mail" [level=2]
    - paragraph: From Mail
    - paragraph: Browse, search and filter the messages and drafts of the selected account.
    - group "List density":
      - text: ""
      - heading "List density" [level=3]
      - paragraph: Full rows show a preview line, medium rows drop it, compact rows take one line.
      - radio "Full" [checked]
      - text: Full
      - radio "Medium"
      - text: Medium
      - radio "Compact"
      - text: Compact
    - heading "Date headings" [level=3]
    - paragraph: Group messages under headings such as Today and November.
    - checkbox "Date headings" [checked]
    - heading "Download recent mail ahead of time" [level=3]
    - paragraph: After each refresh, the newest messages are saved so they open instantly, even offline. This never marks them as read.
    - checkbox "Download recent mail ahead of time" [checked]
    - text: Messages to keep ready
    - status: /\d+/
    - paragraph: /The newest messages in your Inbox\. More uses more storage and bandwidth; messages over \d+ MB still open on demand\./
    - slider "Messages to keep ready": /\d+/
    - button "Reset to defaults" [disabled]
    - status