<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f1311" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo-square.svg" />
    <meta name="description" content="Colecto, a customisable mail client." />
    <title>Colecto</title>
    <style>
      /* Startup splash: painted before any script runs, removed by main.ts. Matches --ground. */
      html, body { margin: 0; height: 100%; background: oklch(0.112 0.002 165); }
      #startup { position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center; background: oklch(0.112 0.002 165); }
      #startup img { width: 176px; height: auto; animation: startup-in 320ms cubic-bezier(0.23, 1, 0.32, 1) both; }
      #startup span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
      @keyframes startup-in { from { opacity: 0; transform: scale(0.96); } }
      @media (prefers-reduced-motion: reduce) { #startup img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="startup" role="status"><img src="/src/assets/logo-full.svg" alt="" /><span>Loading Colecto</span></div>
    <div id="app" inert></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
